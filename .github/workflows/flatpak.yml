---
name: flatpak-build

on:
  push:
    branches:
      - master
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  flatpak-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux arm64
            os: ubuntu-24.04-arm

          - name: Linux x86_64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: "${{ matrix.name }} Flatpak"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Linux Flatpak build
        run: |
          sudo apt install -y --no-install-recommends elfutils flatpak-builder

          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

          flatpak-builder --user --install --force-clean --install-deps-from=flathub zig-out/build io.github.rcalixte.libqt6zig-demo.yml
