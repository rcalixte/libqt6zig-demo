---
app-id: io.github.rcalixte.libqt6zig-demo
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: mdoutliner
finish-args:
  - --device=dri
  - --filesystem=home
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - '*.a'
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - /share/pkgconfig
modules:
  - name: mdoutliner
    buildsystem: simple
    build-options:
      append-path: zig
    build-commands:
      - zig build -Doptimize=fast --prefix /app
    sources:
      - type: archive
        sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        url: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
        dest: zig
        only-arches: [x86_64]
      - type: archive
        sha256: 9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
        url: https://ziglang.org/download/0.17.0/zig-aarch64-linux-0.17.0.tar.xz
        dest: zig
        only-arches: [aarch64]
      - type: dir
        path: .
        skip:
          - .flatpak-builder
          - .git
          - .github
          - .zig-cache
          - flatpak
          - zig
          - zig-out
          - zig-pkg
      - type: git
        url: https://github.com/rcalixte/libqt6zig.git
        commit: c2f2ef192b2665bf8d8f306d72b36d6b865b3348
        dest: zig-pkg/libqt6zig-6.8.2-OSXtXKGCWhwcF96GLwsB5RVEmkswKQFrVp2QOADyAeBr
