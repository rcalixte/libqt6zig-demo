---
app-id: io.github.rcalixte.libqt6zig-demo
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: mdoutliner
finish-args:
  - --device=dri
  - --filesystem=home
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - '*.a'
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - /share/pkgconfig
modules:
  - name: mdoutliner
    buildsystem: simple
    build-options:
      append-path: zig
    build-commands:
      - zig build -Doptimize=ReleaseFast --prefix /app
    sources:
      - type: archive
        sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
        dest: zig
        only-arches: [x86_64]
      - type: archive
        sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
        url: https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz
        dest: zig
        only-arches: [aarch64]
      - type: dir
        path: .
        skip:
          - .flatpak-builder
          - .git
          - .github
          - .zig-cache
          - flatpak
          - zig
          - zig-out
          - zig-pkg
      - type: git
        url: https://github.com/rcalixte/libqt6zig.git
        commit: 3bf26786dbdeb5980a442f5fff2d6f49ccff2277
        dest: zig-pkg/libqt6zig-6.8.2-OSXtXHTCGx9Et4IOaIsCHzTt-_eMiKZKy_SnvtVeCoDW
